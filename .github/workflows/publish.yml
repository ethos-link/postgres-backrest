name: Publish Docker Image

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:
    inputs:
      postgres_version:
        description: 'PostgreSQL base image version to build from'
        required: false
      revision:
        description: 'Image rebuild revision, e.g. 1 publishes <postgres_version>-r1'
        required: false

env:
  REGISTRY_DOCKER: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write # Required for Trivy SARIF (if used) or just in case

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read versions
        id: version
        run: |
          POSTGRES_VERSION="${{ github.event.inputs.postgres_version }}"
          REVISION="${{ github.event.inputs.revision }}"

          if [ -z "$POSTGRES_VERSION" ]; then
            POSTGRES_VERSION="$(cat POSTGRES_VERSION)"
          fi

          if [ -n "$REVISION" ]; then
            if ! [[ "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
              echo "Revision must be a positive integer." >&2
              exit 1
            fi

            IMAGE_VERSION="$POSTGRES_VERSION-r$REVISION"
          else
            IMAGE_VERSION="$(cat VERSION)"
          fi

          echo "POSTGRES_VERSION=$POSTGRES_VERSION" >> "$GITHUB_OUTPUT"
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse existing release tag
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_VERSION="${{ steps.version.outputs.IMAGE_VERSION }}"

          for image in \
            "${{ env.REGISTRY_DOCKER }}/ethoslink/postgres-backrest" \
            "${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}"
          do
            if docker buildx imagetools inspect "$image:$IMAGE_VERSION" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing image tag: $image:$IMAGE_VERSION" >&2
              exit 1
            fi
          done

          if git ls-remote --exit-code --tags origin "refs/tags/$IMAGE_VERSION" >/dev/null 2>&1; then
            echo "Refusing to recreate existing git tag: $IMAGE_VERSION" >&2
            exit 1
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_DOCKER }}/ethoslink/postgres-backrest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.IMAGE_VERSION }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.IMAGE_VERSION }}
            org.opencontainers.image.base.name=docker.io/library/postgres:${{ steps.version.outputs.POSTGRES_VERSION }}

      - name: Extract first Docker tag
        id: extract_tag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          # For Pull Requests:
          # - Build only for the runner's architecture (linux/amd64 usually) to skip QEMU emulation overhead.
          # - 'load: true' is required for Trivy to scan the image locally.
          # - 'load: true' is incompatible with multi-platform builds.
          # For Push/Release:
          # - Build for all platforms.
          # - 'push: true' to publish to registries.
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          build-args: |
            POSTGRES_VERSION=${{ steps.version.outputs.POSTGRES_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.extract_tag.outputs.tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Create Git Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          VERSION="${{ steps.version.outputs.IMAGE_VERSION }}"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.IMAGE_VERSION }}
          release_name: Image ${{ steps.version.outputs.IMAGE_VERSION }} for PostgreSQL ${{ steps.version.outputs.POSTGRES_VERSION }}
          body: |
            PostgreSQL base image: ${{ steps.version.outputs.POSTGRES_VERSION }}
            Image version: ${{ steps.version.outputs.IMAGE_VERSION }}
          draft: false
          prerelease: false
