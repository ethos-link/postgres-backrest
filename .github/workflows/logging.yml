name: Logging smoke tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y logrotate gettext-base
      - name: Test native OS rotation, expiry and timer integration
        run: python3 tests/test_log_rotation.py
      - name: Build image without publishing
        run: docker build --build-arg POSTGRES_VERSION="$(cat POSTGRES_VERSION)" -t postgres-backrest:logging-test .
      - name: Test effective configuration, backup and asynchronous archiving
        run: ./tests/smoke-image.sh postgres-backrest:logging-test
